server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      # Order matters: specific /api/admin/** prefixes first, the remaining /api/admin/** is content-service.
      routes:
        - id: user-service
          uri: ${services.user.url}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/admin/users/**,/api/admin/invites/**
        - id: subscription-service
          uri: ${services.subscription.url}
          predicates:
            - Path=/api/plans/**,/api/subscriptions/**,/api/payment-config/**,/api/admin/subscriptions/**,/api/admin/plans/**,/api/admin/payment-config/**
        - id: assessment-service
          uri: ${services.assessment.url}
          predicates:
            - Path=/api/tests/**,/api/practice/**,/api/dashboard/**,/api/tiers/**,/api/tickets/**,/api/admin/tickets/**,/api/admin/tier-policy/**,/api/admin/tier-unlocks/**
        - id: content-service
          uri: ${services.content.url}
          predicates:
            - Path=/api/exams/**,/api/topics/**,/api/dictionary/**,/api/admin/**

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  subscription:
    url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}
  content:
    url: ${CONTENT_SERVICE_URL:http://localhost:8083}
  assessment:
    url: ${ASSESSMENT_SERVICE_URL:http://localhost:8084}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    ttl-hours: 12

management:
  endpoints:
    web:
      exposure:
        include: health
