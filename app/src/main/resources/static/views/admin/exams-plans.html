<div class="page" style="max-width:1100px">
  <page-head heading="Exams & Plans" subtitle="Curriculum, payment details and subscription packages">
    <rx-pills options="vm.tabs" value="vm.tab" on-change="vm.tab = v"></rx-pills>
  </page-head>

  <div ng-if="vm.tab === 'curriculum'">
    <rx-loading state="vm.cur">
      <div class="stack" style="gap:16px">
        <rx-card heading="Add exam">
          <div class="d-flex gap-2"><input class="form-control" placeholder="e.g. SAS, Departmental Clerk Exam" ng-model="vm.examName">
            <button class="btn btn-primary" ng-disabled="!vm.examName.trim()" ng-click="vm.addExam()"><i class="bi bi-plus-lg me-1"></i>Add</button></div>
        </rx-card>
        <rx-card ng-if="!vm.cur.data.length"><rx-empty heading="No exams yet" hint="Add your first exam above."></rx-empty></rx-card>
        <rx-card ng-repeat="e in vm.cur.data" heading="{{e.name}}">
          <card-actions><button class="btn btn-light btn-sm" ng-click="vm.deleteExam(e)"><i class="bi bi-trash me-1"></i>Delete</button></card-actions>
          <div class="row-line" ng-repeat="p in e.papers">
            <span><b>{{p.name}}</b> <span class="small muted">· {{p.topics.length}} topics</span></span>
            <button class="btn btn-light btn-sm" ng-click="vm.deletePaper(p)"><i class="bi bi-trash"></i></button>
          </div>
          <div class="d-flex gap-2 mt-3">
            <input class="form-control" placeholder="Add paper, e.g. Paper I: Financial Rules" ng-model="vm.paperNames[e.id]">
            <button class="btn btn-light" ng-disabled="!vm.paperNames[e.id].trim()" ng-click="vm.addPaper(e)"><i class="bi bi-plus-lg me-1"></i>Add paper</button>
          </div>
        </rx-card>
      </div>
    </rx-loading>
  </div>

  <div ng-if="vm.tab === 'payment'">
    <rx-loading state="vm.cfg">
      <rx-card heading="Payment gateway setup">
        <div class="row g-3 mb-3">
          <div class="col-md-6"><label class="form-label">Receiving UPI ID</label><input class="form-control" ng-model="vm.cfgForm.upiId"></div>
          <div class="col-md-6"><label class="form-label">Account / business name</label><input class="form-control" ng-model="vm.cfgForm.accountName"></div>
          <div class="col-md-6"><label class="form-label">Admin support email</label><input class="form-control" ng-model="vm.cfgForm.supportEmail"></div>
          <div class="col-md-6"><label class="form-label">WhatsApp number for payment alerts</label><input class="form-control" ng-model="vm.cfgForm.whatsappNumber">
            <div class="form-text">With country code, digits only, e.g. 919876543210</div></div>
        </div>
        <button class="btn btn-primary" ng-disabled="!vm.cfgDirty()" ng-click="vm.saveCfg()"><i class="bi bi-save me-1"></i>Save settings</button>
      </rx-card>
    </rx-loading>
  </div>

  <div ng-if="vm.tab === 'plans'">
    <div class="text-end mb-3"><button class="btn btn-primary" ng-click="vm.newPlan()"><i class="bi bi-plus-lg me-1"></i>Design a plan</button></div>
    <rx-loading state="vm.plans">
      <div class="row g-3">
        <div class="col-md-4" ng-repeat="p in vm.plans.data">
          <rx-card>
            <span class="rb brand">{{vm.examOf(p.examId)}}</span>
            <h3 class="mt-2">{{p.name}}</h3>
            <div class="fs-3 fw-bold">₹{{p.priceInr}}</div><div class="muted">{{p.durationDays}} days</div>
            <ul class="muted"><li ng-repeat="x in p.features">{{x}}</li></ul>
            <div class="d-flex gap-2"><button class="btn btn-light btn-sm" ng-click="vm.editPlan(p)">Edit</button>
              <button class="btn btn-light btn-sm" ng-click="vm.deletePlan(p)"><i class="bi bi-trash"></i></button></div>
          </rx-card>
        </div>
        <div class="col-12" ng-if="!vm.plans.data.length"><rx-card><rx-empty heading="No plans yet"></rx-empty></rx-card></div>
      </div>
    </rx-loading>
    <rx-modal ng-if="vm.edit" heading="{{vm.edit.id ? 'Edit plan' : 'Custom plan designer'}}" on-close="vm.edit = null">
      <div class="mb-3"><label class="form-label">Plan name</label><input class="form-control" ng-model="vm.edit.name" placeholder="Part I Access - 90 Days"></div>
      <div class="mb-3"><label class="form-label">Target exam</label>
        <select class="form-select" ng-model="vm.edit.examId"><option value="">Select exam</option><option ng-repeat="x in vm.cur.data" value="{{x.id}}">{{x.name}}</option></select></div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label">Price (₹)</label><input class="form-control" type="number" ng-model="vm.edit.priceInr"></div>
        <div class="col-6"><label class="form-label">Duration (days)</label><input class="form-control" type="number" ng-model="vm.edit.durationDays"></div>
      </div>
      <div><label class="form-label">Marketing bullet points (one per line)</label><textarea class="form-control" ng-model="vm.edit.features"></textarea></div>
      <modal-footer>
        <button class="btn btn-light" ng-click="vm.edit = null">Cancel</button>
        <button class="btn btn-primary" ng-disabled="!vm.edit.name || !vm.edit.examId" ng-click="vm.savePlan()">Save plan</button>
      </modal-footer>
    </rx-modal>
  </div>
</div>
