<div class="page-center">
  <div class="auth-card">
    <div class="brand"><div class="logo"><i class="bi bi-mortarboard-fill"></i></div>RegExam</div>
    <div class="steps"><div class="s" ng-repeat="n in [1,2,3]" ng-class="{done: vm.step >= n}"></div></div>
    <div class="alert alert-danger mb-3" ng-if="vm.error">
      {{vm.error.message}} <a href="#/login" ng-if="vm.error.code === 'ALREADY_REGISTERED'"><b>Log in</b></a>
    </div>

    <form ng-if="vm.step === 1" ng-submit="vm.checkInvite()">
      <h2>Enter your invite code</h2>
      <p class="muted">Registration is by invitation only. Each code works once.</p>
      <div class="mb-3"><label class="form-label">Invite code</label>
        <input class="form-control" ng-model="vm.invite" ng-change="vm.invite = vm.invite.toUpperCase()" placeholder="e.g. K7PQ2MXA" autofocus></div>
      <button class="btn btn-primary btn-lg w-100" ng-disabled="!vm.invite || vm.busy">Continue</button>
      <p class="small muted text-center mt-3 mb-0">Already registered? <a href="#/login">Log in</a></p>
    </form>

    <div ng-if="vm.step === 2">
      <h2>Verify your identity</h2>
      <p class="muted mb-3">Sign in with Google. Your name and email are taken from your Google account.</p>
      <rx-google-sign-in label="Continue" on-token="vm.onToken(t)"></rx-google-sign-in>
      <button class="btn btn-link mt-3 px-0" ng-click="vm.step = 1">Back</button>
    </div>

    <form ng-if="vm.step === 3" ng-submit="vm.submit()">
      <h2>Your departmental profile</h2>
      <p class="muted"><i class="bi bi-check-circle-fill" style="color:var(--green)"></i> Invite code accepted</p>
      <div class="row g-3 mb-2">
        <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" value="{{vm.who.name}}" readonly></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{vm.who.email}}" readonly></div>
        <div class="col-md-6"><label class="form-label">Age</label><input class="form-control" type="number" min="18" max="70" required ng-model="vm.f.age"></div>
        <div class="col-md-6"><label class="form-label">Mobile / WhatsApp (10 digits)</label><input class="form-control" required pattern="\d{10}" maxlength="10" ng-model="vm.f.mobile"></div>
        <div class="col-md-6"><label class="form-label">Designation</label>
          <select class="form-select" ng-model="vm.f.designation" ng-options="d for d in vm.designations"></select></div>
        <div class="col-md-6"><div ng-if="vm.f.designation === 'Other'"><label class="form-label">Please specify</label><input class="form-control" required ng-model="vm.f.designationOther"></div></div>
        <div class="col-md-6"><label class="form-label">Station / place of posting</label><input class="form-control" required placeholder="Delhi, Pune, Kolkata..." ng-model="vm.f.station"></div>
        <div class="col-md-6"><label class="form-label">Office / controller</label><input class="form-control" required placeholder="PCDA Western Command" ng-model="vm.f.office"></div>
      </div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="g1" required ng-model="vm.f.detailsGenuine"><label class="form-check-label" for="g1">I affirm that the details provided are genuine.</label></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="g2" required ng-model="vm.f.authorizedEmployee"><label class="form-check-label" for="g2">I affirm that I am an authorized employee of the department.</label></div>
      <button class="btn btn-primary btn-lg w-100" ng-disabled="vm.busy">Create my account</button>
    </form>
  </div>
</div>
