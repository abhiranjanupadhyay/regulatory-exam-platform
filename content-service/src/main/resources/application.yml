server:
  port: 8083

spring:
  application:
    name: content-service
  datasource:
    # Neon: DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regexam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
