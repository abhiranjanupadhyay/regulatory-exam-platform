server:
  port: 8081

spring:
  application:
    name: user-service
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    ttl-hours: 12
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    # dev-mode accepts "dev:email|Name" as an id token. Never enable outside local development.
    dev-mode: ${GOOGLE_DEV_MODE:false}
  admin-emails: ${ADMIN_EMAILS:}
  public-url: ${PUBLIC_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
