server:
  port: 8084

spring:
  application:
    name: assessment-service
  datasource:
    # Neon: DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regexam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  content:
    url: ${CONTENT_SERVICE_URL:http://localhost:8083}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

exam:
  negative-mark: 0.25
  pass-percentage: 40
  full:
    questions: 100
    minutes: 120
  topic:
    questions: 20
    minutes: 30
  qualifying:
    questions: 50
    minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health
