server:
  port: 8084

spring:
  application:
    name: assessment-service
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}

services:
  content:
    url: ${CONTENT_SERVICE_URL:http://localhost:8083}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

exam:
  negative-mark: 0.25
  pass-percentage: 40
  full:
    questions: 100
    minutes: 120
  topic:
    questions: 20
    minutes: 30
  qualifying:
    questions: 50
    minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health
