server:
  port: 8082

spring:
  application:
    name: subscription-service
  datasource:
    # Neon: DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regexam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
