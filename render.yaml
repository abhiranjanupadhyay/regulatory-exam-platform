# Render blueprint. One backend web service (the whole API) plus the static frontend.
# Postgres is external (Neon): enter DB_URL (jdbc:postgresql://<host>/<db>?sslmode=require), DB_USER, DB_PASSWORD.
services:
  - type: web
    name: regexam-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_DEV_MODE
        value: "false"
      - key: PUBLIC_URL
        sync: false

  - type: web
    name: regexam-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_DEV_LOGIN
        value: "false"
    routes:
      # Replace regexam-api.onrender.com with your API service's actual onrender.com URL.
      - type: rewrite
        source: /api/*
        destination: https://regexam-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
