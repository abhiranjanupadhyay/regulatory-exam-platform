# Render blueprint. One web service: the Spring Boot API and the web UI it serves (static files in the jar).
# Postgres is external (Neon): enter DB_URL (jdbc:postgresql://<host>/<db>?sslmode=require), DB_USER, DB_PASSWORD.
services:
  - type: web
    name: regulatory-exam-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_DEV_MODE
        value: "false"
      - key: PUBLIC_URL
        sync: false
